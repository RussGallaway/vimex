name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: vimex-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify release tag
        run: |
          # shellcheck disable=SC2016
          bun -e 'const v = (await Bun.file("package.json").json()).version; if (process.env.GITHUB_REF_NAME !== `v${v}`) throw new Error("Tag must match package version")'
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          HERDR_ENV: '0'
          TERM: xterm-256color
      - run: bun run build
      - name: Test the packaged executable and offline syntax
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bundle="$PWD/dist/vimex-${GITHUB_REF_NAME}-${TARGET}"
          bun tests/install/cli-smoke.ts "$bundle/vimex"
          bun build --compile --target=bun --define VIMEX_COMPILED=true tests/install/syntax-smoke.ts --outfile "$bundle/syntax-smoke"
          (cd "$RUNNER_TEMP" && "$bundle/syntax-smoke")
          python -m pip install -r tests/terminal/requirements-live.txt
          VIMEX_TEST_BINARY="$bundle/vimex" python tests/terminal/visual-driver.py
          python tests/install/resume-smoke.py "$bundle/vimex"
      - run: bun run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vimex-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vimex-*
          path: dist
          merge-multiple: true
      - run: bun run release:manifest
      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=missing
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" == true ]]; then state=draft; else state=published; fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: ${{ steps.release.outputs.state != 'published' }}
        with:
          subject-path: 'dist/*.tar.gz'
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=--prerelease; else prerelease=; fi
          action=$(bun scripts/release/policy.ts publication "${{ steps.release.outputs.state }}")
          if [[ "$action" == reuse ]]; then
            # Published assets are immutable: repair the formula from their manifest.
            gh release download "$GITHUB_REF_NAME" --pattern vimex-release.json --dir dist --clobber
            exit 0
          fi
          if [[ "$action" == create ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/vimex-release.json dist/SHA256SUMS install.sh --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Deploy monorepo formula after stable publication
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          VIMEX_RELEASE_DEPLOY_KEY: ${{ secrets.VIMEX_RELEASE_DEPLOY_KEY }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          action=$(bun scripts/release/policy.ts formula "$RELEASE_VERSION" "$latest")
          if [[ "$action" != deploy ]]; then
            echo "Skipping formula update for $RELEASE_VERSION: $action"
            exit 0
          fi
          git fetch origin main
          git checkout --detach origin/main
          bun run release:formula dist/vimex-release.json
          if git diff --quiet -- Formula/vimex.rb; then
            echo "Formula already matches $RELEASE_VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/vimex.rb
          [[ "$(git diff --cached --name-only)" == "Formula/vimex.rb" ]]
          git commit -m "Update Homebrew formula for ${RELEASE_VERSION}"

          key_file="$RUNNER_TEMP/vimex-release-key"
          known_hosts="$RUNNER_TEMP/github-known-hosts"
          printf '%s\n' "$VIMEX_RELEASE_DEPLOY_KEY" > "$key_file"
          unset VIMEX_RELEASE_DEPLOY_KEY
          chmod 600 "$key_file"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
