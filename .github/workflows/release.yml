name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  HUSKY: "0"
concurrency:
  group: vimex-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - name: Select verified candidate for this exact tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/select-candidate.ts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Verify candidate identity and every published byte
        env:
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: bun scripts/release/candidate.ts verify dist
      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=missing
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" == true ]]; then state=draft; else state=published; fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=--prerelease; else prerelease=; fi
          action=$(bun scripts/release/policy.ts publication "${{ steps.release.outputs.state }}")
          if [[ "$action" == reuse ]]; then
            # Published assets are immutable: repair the formula from their manifest.
            mkdir published
            gh release download "$GITHUB_REF_NAME" --pattern vimex-release.json --dir published
            cmp dist/vimex-release.json published/vimex-release.json
            exit 0
          fi
          if [[ "$action" == create ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/vimex-release.json dist/SHA256SUMS dist/install.sh dist/candidate.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Deploy monorepo formula after stable publication
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          VIMEX_RELEASE_DEPLOY_KEY: ${{ secrets.VIMEX_RELEASE_DEPLOY_KEY }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          action=$(bun scripts/release/policy.ts formula "$RELEASE_VERSION" "$latest")
          if [[ "$action" != deploy ]]; then
            echo "Skipping formula update for $RELEASE_VERSION: $action"
            exit 0
          fi
          git fetch origin main
          git checkout --detach origin/main
          cp dist/vimex.rb Formula/vimex.rb
          if git diff --quiet -- Formula/vimex.rb; then
            echo "Formula already matches $RELEASE_VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/vimex.rb
          [[ "$(git diff --cached --name-only)" == "Formula/vimex.rb" ]]
          git commit -m "chore(homebrew): update formula for ${RELEASE_VERSION}"

          key_file="$RUNNER_TEMP/vimex-release-key"
          known_hosts="$RUNNER_TEMP/github-known-hosts"
          printf '%s\n' "$VIMEX_RELEASE_DEPLOY_KEY" > "$key_file"
          unset VIMEX_RELEASE_DEPLOY_KEY
          chmod 600 "$key_file"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
