name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: vimex-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release tag
        run: bun -e 'const v = (await Bun.file("package.json").json()).version; if (process.env.GITHUB_REF_NAME !== `v${v}`) throw new Error("Tag must match package version")'
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          HERDR_ENV: '0'
          TERM: xterm-256color
      - run: bun run build
      - name: Test the packaged executable and offline syntax
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bundle="$PWD/dist/vimex-${GITHUB_REF_NAME}-${TARGET}"
          bun tests/install/cli-smoke.ts "$bundle/vimex"
          bun build --compile --target=bun --define VIMEX_COMPILED=true tests/install/syntax-smoke.ts --outfile "$bundle/syntax-smoke"
          (cd "$RUNNER_TEMP" && "$bundle/syntax-smoke")
          python -m pip install -r tests/terminal/requirements-live.txt
          VIMEX_TEST_BINARY="$bundle/vimex" python tests/terminal/visual-driver.py
          python tests/install/resume-smoke.py "$bundle/vimex"
      - run: bun run package
      - uses: actions/upload-artifact@v7
        with:
          name: vimex-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/download-artifact@v8
        with:
          pattern: vimex-*
          path: dist
          merge-multiple: true
      - run: bun run release:manifest
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.tar.gz'
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=--prerelease; else prerelease=; fi
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$state" == false ]]; then
              # Published assets are immutable: repair the formula from their manifest.
              gh release download "$GITHUB_REF_NAME" --pattern vimex-release.json --dir dist --clobber
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/vimex-release.json dist/SHA256SUMS install.sh --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Propose monorepo formula update after stable publication
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [[ "$latest" != "$RELEASE_VERSION" ]]; then
            echo "Skipping formula update for superseded release $RELEASE_VERSION"
            exit 0
          fi
          branch="release/formula-${RELEASE_VERSION#v}"
          git fetch origin main
          git checkout -B "$branch" origin/main
          bun run release:formula dist/vimex-release.json
          if git diff --quiet -- Formula/vimex.rb; then
            echo "Formula already matches $RELEASE_VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/vimex.rb
          git commit -m "Update Homebrew formula for ${RELEASE_VERSION}"
          git push --force-with-lease origin HEAD:"$branch"
          pull_request=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -z "$pull_request" ]]; then
            gh pr create --base main --head "$branch" \
              --title "Update Homebrew formula for ${RELEASE_VERSION}" \
              --body "Updates the monorepo formula from the verified manifest published with ${RELEASE_VERSION}."
            pull_request=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')
          fi
          # GITHUB_TOKEN-authored pull requests do not emit another workflow
          # event, so attach the required checks to the formula commit directly.
          gh workflow run check.yml --ref "$branch"
          gh pr merge "$pull_request" --auto --squash
