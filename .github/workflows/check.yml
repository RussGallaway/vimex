name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # Formula-only release PRs are created by github-actions[bot]. GitHub
    # otherwise holds their duplicate pull_request run for maintainer approval;
    # release.yml dispatches this workflow explicitly for the same head commit.
    paths-ignore:
      - Formula/vimex.rb
  pull_request_target:
    paths:
      - Formula/vimex.rb
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request_target' && 0 || 1 }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify trusted formula release change
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          [[ "$PR_ACTOR" == "github-actions[bot]" ]]
          [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$HEAD_REF" == release/formula-* ]]
          [[ "$(git diff --name-only "$BASE_SHA...$HEAD_SHA")" == "Formula/vimex.rb" ]]
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          HERDR_ENV: '0'
          TERM: xterm-256color
