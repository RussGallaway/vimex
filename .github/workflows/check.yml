name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # Formula-only release PRs are created by github-actions[bot]. GitHub
    # otherwise holds their duplicate pull_request run for maintainer approval;
    # release.yml dispatches this workflow explicitly for the same head commit.
    paths-ignore:
      - Formula/vimex.rb
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          HERDR_ENV: '0'
          TERM: xterm-256color
