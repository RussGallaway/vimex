name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - Formula/vimex.rb
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
env:
  HUSKY: "0"
jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate workflow expressions and shell scripts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Validate squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMITLINT_PR_TITLE: "1"
        run: printf '%s\n' "$PR_TITLE" | bun run commitlint
      - name: Validate source
        shell: bash
        run: bun run check 2>&1 | tee release-check.log
        env:
          HERDR_ENV: "0"
          TERM: xterm-256color
      - name: Retain failed validation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-check-${{ matrix.os }}
          overwrite: true
          path: release-check.log
          retention-days: 14
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, workflows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Install offline visual probe dependencies
        run: python3 -m pip install -r tests/terminal/requirements-live.txt
      - name: Validate native release bundle
        shell: bash
        run: bun run check:release --package-only --outdir dist 2>&1 | tee release-package.log
        env:
          HERDR_ENV: "0"
          TERM: xterm-256color
      - name: Verify clean install and upgrade
        shell: bash
        run: bun scripts/release/install-smoke.ts dist 2>&1 | tee release-install.log
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain failed packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-package-${{ matrix.target }}
          overwrite: true
          path: |
            release-package.log
            release-install.log
            dist/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vimex-${{ matrix.target }}
          overwrite: true
          retention-days: 14
          path: |
            dist/*.tar.gz
            dist/*.json
          if-no-files-found: error
  candidate:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vimex-*
          path: dist
          merge-multiple: true
      - name: Verify manifest and formula before tagging
        run: |
          bun run release:manifest
          bun run release:formula dist/vimex-release.json dist/vimex.rb
          ruby -c dist/vimex.rb
          cp install.sh dist/install.sh
          bun scripts/release/candidate.ts prepare dist
      - name: Attest verified candidate before tagging
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/vimex-release.json
            dist/SHA256SUMS
            dist/vimex.rb
            dist/install.sh
            dist/candidate.json
          if-no-files-found: error
          retention-days: 14
      - name: Report candidate readiness
        run: |
          printf 'Verified release candidate for %s. Tag this exact commit within 14 days; Release promotes these artifacts without rebuilding.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
