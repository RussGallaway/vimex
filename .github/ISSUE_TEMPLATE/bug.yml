name: Bug report
description: Report a reproducible Vimex problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the shortest reliable sequence, including relevant keys or commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vimex version
      placeholder: Output of vimex --version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, terminal, multiplexer or Herdr, TERM, terminal dimensions, and Codex version when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add logs, screenshots, or configuration with secrets removed.
